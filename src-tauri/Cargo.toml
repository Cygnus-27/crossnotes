[package]
name = "fluqsr"
version = "0.1.0"
description = "Fast, encrypted, peer-to-peer file transfer over the local network."
authors = ["Cygnus"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise conflicts on Windows. See rust-lang/cargo#8519.
name = "fluqsr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["net", "io-util", "fs", "sync", "time", "rt"] }

# TLS 1.3 with `ring`, chosen over aws-lc-rs so the build needs only the MSVC
# toolchain Tauri already requires (no cmake/nasm).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
x509-parser = "0.16"
sha2 = "0.10"
blake3 = "1"

mdns-sd = "0.20"
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# `macros` and `rt-multi-thread` are only needed by #[tokio::test].
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
